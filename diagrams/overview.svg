<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 506" width="680" height="506" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>OP-XY hardware overview</title><desc>Two ADSP-BF703 processors, master and slave, linked by an SPI bridge and a TDM audio link. The master connects to the display, the SPI flash, the nRF52840, the PSoC and USB. The slave connects to the e-MMC and the audio and CV chips.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="505" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="200" y="40" width="130" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="265.0" y="59.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">ST7796</text>
<text x="265.0" y="77.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">LCD, 222 × 480 visible</text>
<rect x="350" y="40" width="130" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="415.0" y="59.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">SPI flash</text>
<text x="415.0" y="77.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">8 Mbit, program code</text>
<rect x="500" y="40" width="130" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="565.0" y="59.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Kioxia e-MMC</text>
<text x="565.0" y="77.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">16 GB</text>
<line x1="300" y1="148" x2="300" y2="99" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="292" y="124" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central" fill="#444441">8080, 8-bit</text>
<line x1="385" y1="99" x2="385" y2="147" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="393" y="124" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#444441">SPI2</text>
<line x1="565" y1="99" x2="565" y2="147" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="573" y="124" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#444441">MSI0</text>
<rect x="40" y="150" width="150" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="115.0" y="169.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#26215C">nRF52840</text>
<text x="115.0" y="187.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Bluetooth LE</text>
<rect x="40" y="274" width="150" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="115.0" y="293.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#26215C">PSoC 4200L</text>
<text x="115.0" y="311.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Backplane MCU</text>
<rect x="265" y="150" width="150" height="180" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="340.0" y="222.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#26215C">ADSP-BF703</text>
<text x="340.0" y="240.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Master</text>
<text x="340.0" y="258.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#3C3489">2 Gbit DDR2</text>
<rect x="490" y="150" width="150" height="180" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="565.0" y="222.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#26215C">ADSP-BF703</text>
<text x="565.0" y="240.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Slave</text>
<text x="565.0" y="258.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#3C3489">2 Gbit DDR2</text>
<line x1="193" y1="178" x2="262" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="227" y="166" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">UART1</text>
<line x1="193" y1="302" x2="262" y2="302" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="227" y="290" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">UART0</text>
<line x1="418" y1="200" x2="487" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="452" y="188" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">SPI bridge</text>
<line x1="418" y1="280" x2="487" y2="280" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="452" y="268" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">TDM audio</text>
<rect x="40" y="384" width="150" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="115.0" y="403.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Backplane parts</text>
<text x="115.0" y="421.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">Keys, LEDs, power</text>
<rect x="265" y="384" width="150" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="340.0" y="403.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">USB-C port</text>
<text x="340.0" y="421.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">FUSB302 for PD</text>
<rect x="490" y="384" width="150" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="565.0" y="403.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Audio and CV</text>
<text x="565.0" y="421.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">Codec, amplifier, DACs</text>
<line x1="100" y1="333" x2="100" y2="381" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M170 333 L170 357 L300 357 L300 381" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="235" y="347" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">CC, PD</text>
<line x1="370" y1="333" x2="370" y2="381" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="378" y="362" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#444441">USB HS</text>
<line x1="565" y1="333" x2="565" y2="381" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="573" y="362" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#444441">I2C, TDM</text>
<rect x="40" y="472" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
<text x="58" y="478" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#444441">Processor or MCU</text>
<rect x="182" y="472" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="200.4" y="478" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#444441">Peripheral or memory</text>
</svg>
