<line x1="572" y1="359" x2="572" y2="407" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="564" y="383" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central" fill="#444441">UART1, RTS/CTS</text>
