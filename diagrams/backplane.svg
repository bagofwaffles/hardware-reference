<text x="340.5" y="429.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">SKY66404-11</text>
<text x="340.5" y="447.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">2.4 GHz front end</text>
