<rect x="0.5" y="0.5" width="679" height="513" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="40" y="40" width="135" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
