<text x="115" y="142" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#444441">0x66, 0x69</text>
<line x1="262" y1="99" x2="262" y2="167" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="270" y="126" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#444441">I2C 0x40</text>
<text x="270" y="142" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#444441">(inferred)</text>
