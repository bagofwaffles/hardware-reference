<text x="107.5" y="77.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">Charger, fuel gauge</text>
<rect x="195" y="40" width="135" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
