<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 514" width="680" height="514" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>OP-XY PSoC and radio</title><desc>The PSoC with its peripherals: the MAX77818 charger, the AS3709 PMIC, the FUSB302 and a key LED driver on I2C, the LSM6DSO and the TW11 key scanner on SPI, the keys and knobs, and the master processor on UART0. Below, the master's UART1 to the nRF52840 with its front end and antennas.</desc>
