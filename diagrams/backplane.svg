<text x="262.5" y="77.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">PMIC, on the DSP board</text>
<rect x="350" y="40" width="135" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="417.5" y="59.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">FUSB302</text>
<text x="417.5" y="77.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#444441">USB-C PD</text>
<rect x="505" y="40" width="135" height="56" rx="4" fill="#FFFFFF" stroke="#888780" stroke-dasharray="5 4"/>
<text x="572.5" y="59.0" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#444441">Key LED driver</text>
<text x="572.5" y="77.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Not identified</text>
